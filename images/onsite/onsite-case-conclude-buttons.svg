<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><clipPath id="pg"><rect width="880" height="480"/></clipPath></defs><g clip-path="url(#pg)"><rect x="0" y="0" width="880" height="480" rx="0" fill="#0a0a0a"/><text x="28" y="48" font-size="16" font-weight="600" fill="#fafafa" text-anchor="start">Conclude this case</text><rect x="28" y="64" width="153.8" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="104.9" y="87.0" font-size="14" font-weight="500" fill="#fafafa" text-anchor="middle">Send for review</text><rect x="189.8" y="64" width="170.04" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="274.82" y="87.0" font-size="14" font-weight="500" fill="#fafafa" text-anchor="middle">Close as resolved</text><rect x="28" y="108" width="161.92" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="108.96" y="131.0" font-size="14" font-weight="500" fill="#fafafa" text-anchor="middle">Cancel this case</text><rect x="24" y="60" width="165.8" height="44" rx="10" fill="none" stroke="#FF7A1A" stroke-width="2.5"/><rect x="372" y="20" width="480" height="440" rx="0" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/><text x="392" y="56" font-size="18" font-weight="600" fill="#fafafa" text-anchor="start">Send for review</text><line x1="372" y1="384" x2="852" y2="384" stroke="#262626" stroke-width="1"/><rect x="392" y="404" width="214.0" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="499.0" y="427.0" font-size="14" font-weight="500" fill="#fafafa" text-anchor="middle">Cancel</text><rect x="618.0" y="404" width="214.0" height="36" rx="8" fill="#c696ff" opacity="0.5"/><text x="725.0" y="427.0" font-size="14" font-weight="500" fill="#171717" text-anchor="middle">Confirm</text><line x1="372.0" y1="0" x2="372.0" y2="0" stroke="#303030" stroke-width="1"/><text x="392" y="102" font-size="14" font-weight="400" fill="#a1a1a1" text-anchor="start">The desk could not safely act, so it has gone to a</text><text x="392" y="122" font-size="14" font-weight="400" fill="#a1a1a1" text-anchor="start">reviewer with a stated conclusion type.</text><text x="392" y="170" font-size="14" font-weight="500" fill="#fafafa">What kind of review?<tspan fill="#ff6467"> *</tspan></text><rect x="392" y="182" width="440" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="404" y="205.0" font-size="14" font-weight="400" fill="#a1a1a1" text-anchor="start">Choose the conclusion type</text><g transform="translate(804 192.0) scale(0.6666666666666666)" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><rect x="392" y="222" width="440" height="136" rx="8" fill="#171717" stroke="#303030" stroke-width="1"/><text x="406" y="247" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Identity dispute</text><rect x="396" y="258" width="432" height="32" rx="6" fill="#262626"/><text x="406" y="279" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Payment review</text><text x="406" y="311" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Ticket entitlement review</text><text x="406" y="343" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Operational incident</text></g></svg>