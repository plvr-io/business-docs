<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><clipPath id="pg"><rect width="556" height="520"/></clipPath></defs><g clip-path="url(#pg)"><rect x="0" y="0" width="556" height="520" rx="0" fill="#050505"/><rect x="28" y="20" width="500" height="480" rx="0" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/><text x="48" y="56" font-size="18" font-weight="600" fill="#fafafa" text-anchor="start">Add an approved guest</text><line x1="28" y1="424" x2="528" y2="424" stroke="#262626" stroke-width="1"/><rect x="48" y="444" width="224.0" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="160.0" y="467.0" font-size="14" font-weight="500" fill="#fafafa" text-anchor="middle">Cancel</text><rect x="284.0" y="444" width="224.0" height="36" rx="8" fill="#c696ff"/><text x="396.0" y="467.0" font-size="14" font-weight="500" fill="#171717" text-anchor="middle">Add guest</text><text x="48" y="106" font-size="14" font-weight="500" fill="#fafafa">Full name<tspan fill="#ff6467"> *</tspan></text><rect x="48" y="118" width="460" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="60" y="141.0" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Taylor Kim</text><text x="48" y="188" font-size="14" font-weight="500" fill="#fafafa">Ticket type ID<tspan fill="#ff6467"> *</tspan></text><rect x="48" y="200" width="460" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="60" y="223.0" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">1042</text><text x="48" y="254" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">From Ticket Management. A guest still counts against a ticket</text><text x="48" y="271" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">type.</text><text x="48" y="317" font-size="14" font-weight="500" fill="#fafafa">Who approved this?<tspan fill="#ff6467"> *</tspan></text><rect x="48" y="329" width="460" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="60" y="352.0" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Approved by the promoter by phone, 20:15</text><text x="48" y="383" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">Stored with this action. Without it, nobody can tell afterwards</text><text x="48" y="400" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">whether this was authorised.</text></g></svg>