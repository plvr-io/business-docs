<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><clipPath id="pg"><rect width="556" height="470"/></clipPath></defs><g clip-path="url(#pg)"><rect x="0" y="0" width="556" height="470" rx="0" fill="#050505"/><rect x="28" y="20" width="500" height="430" rx="0" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/><text x="48" y="56" font-size="18" font-weight="600" fill="#fafafa" text-anchor="start">Add evidence</text><line x1="28" y1="374" x2="528" y2="374" stroke="#262626" stroke-width="1"/><rect x="48" y="394" width="224.0" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="160.0" y="417.0" font-size="14" font-weight="500" fill="#fafafa" text-anchor="middle">Cancel</text><rect x="284.0" y="394" width="224.0" height="36" rx="8" fill="#c696ff"/><text x="396.0" y="417.0" font-size="14" font-weight="500" fill="#171717" text-anchor="middle">Add</text><text x="48" y="104" font-size="14" font-weight="500" fill="#fafafa">Kind</text><rect x="48" y="116" width="460" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="60" y="139.0" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Named confirmation</text><g transform="translate(480 126.0) scale(0.6666666666666666)" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="48" y="184" font-size="14" font-weight="500" fill="#fafafa">What was confirmed, and by whom?<tspan fill="#ff6467"> *</tspan></text><rect x="48" y="196" width="460" height="96" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="60" y="219" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Duty manager Sam Rivera confirmed the cash was</text><text x="60" y="239" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">taken at station 3.</text><text x="48" y="310" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">Your name is recorded with this. Verbal agreement on its own</text><text x="48" y="327" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">isn't evidence.</text></g></svg>