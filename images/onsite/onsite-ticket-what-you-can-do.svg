<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 602" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0" y="0" width="860" height="602" rx="0" fill="#0a0a0a"/><rect x="20" y="20" width="380" height="330" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/><text x="36" y="49" font-size="15" font-weight="600" fill="#fafafa" text-anchor="start" >Confirmation preview</text><line x1="20" y1="66" x2="400" y2="66" stroke="#2e2e2e" stroke-width="1"/><text x="384" y="49" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="end" >TKT-20418</text><text x="36" y="96" font-size="12" font-weight="600" fill="#a1a1a1" text-anchor="start" letter-spacing="0.6">WHAT WILL CHANGE</text><g transform="translate(36 104) scale(0.6666666666666666)" fill="none" stroke="#059669" color="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g><text x="60" y="116" font-size="13.5" font-weight="400" fill="#fafafa" text-anchor="start" >Ticket TKT-20418 is marked as entered.</text><g transform="translate(36 126) scale(0.6666666666666666)" fill="none" stroke="#059669" color="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g><text x="60" y="138" font-size="13.5" font-weight="400" fill="#fafafa" text-anchor="start" >The override is recorded against your name, with</text><text x="60" y="156" font-size="13.5" font-weight="400" fill="#fafafa" text-anchor="start" >the reason and the block it cleared.</text><text x="36" y="186" font-size="12" font-weight="600" fill="#a1a1a1" text-anchor="start" letter-spacing="0.6">WHAT WILL NOT CHANGE</text><circle cx="43" cy="201" r="3" fill="#a1a1a1"/><text x="60" y="206" font-size="13.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >The underlying block stays on the ticket — this</text><text x="60" y="224" font-size="13.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >admits the person, it does not fix the data.</text><circle cx="43" cy="241" r="3" fill="#a1a1a1"/><text x="60" y="246" font-size="13.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >No wristband relationship is created — this event</text><text x="60" y="264" font-size="13.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >does not use them.</text><circle cx="43" cy="281" r="3" fill="#a1a1a1"/><text x="60" y="286" font-size="13.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >No cashless wallet exists for this event.</text><rect x="416" y="20" width="424" height="562" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/><text x="432" y="49" font-size="15" font-weight="600" fill="#fafafa" text-anchor="start" >What you can do</text><line x1="416" y1="66" x2="840" y2="66" stroke="#2e2e2e" stroke-width="1"/><text x="824" y="49" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="end" >Recommended first</text><rect x="432" y="82" width="392" height="118" rx="8" fill="#201d23" stroke="#c696ff" stroke-width="2"/><rect x="444" y="94" width="107.052" height="22" rx="6" fill="#2e1065" stroke="#5b21b6" stroke-width="1"/><text x="452" y="109.55" font-size="13" font-weight="500" fill="#ede9fe" text-anchor="start" >Recommended</text><text x="444" y="134" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Admit with an override</text><text x="444" y="152" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Admits past a block that can be cleared at the desk.</text><g><rect x="444" y="158" width="368" height="32" rx="6" fill="#c696ff"/><text x="556.4768" y="179.04" font-size="14" font-weight="500" fill="#171717" text-anchor="start" >Admit with an override</text></g><rect x="432" y="210" width="392" height="34" rx="6" fill="none" stroke="#2e2e2e" stroke-width="1"/><text x="444" y="232" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Hide everything else (2)</text><g transform="translate(796 219) scale(0.6666666666666666)" fill="none" stroke="#fafafa" color="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="432" y="262" font-size="12" font-weight="600" fill="#a1a1a1" text-anchor="start" letter-spacing="0.6">ENTRY</text><rect x="432" y="270" width="392" height="66" rx="6" fill="none" stroke="#2e2e2e" stroke-width="1"/><text x="444" y="294" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Check in</text><text x="444" y="314" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Marks the ticket as entered.</text><text x="444" y="330" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >Creates no wristband relationship.</text><rect x="432" y="344" width="392" height="66" rx="6" fill="none" stroke="#2e2e2e" stroke-width="1"/><text x="444" y="368" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Check in manually</text><text x="444" y="388" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Marks the ticket as entered without a scan.</text><text x="444" y="404" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >Recorded as a manual entry, so it is distinguishable later.</text><line x1="432" y1="418" x2="824" y2="418" stroke="#2e2e2e" stroke-width="1"/><g><rect x="432" y="430" width="392" height="36" rx="6" fill="#151515" stroke="#2f2f2f" stroke-width="1"/><text x="556.4768" y="453.04" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Record a service case</text></g><text x="432" y="486" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Use this when nothing above resolves it, so the participant isn't</text><text x="432" y="502" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >turned away with nothing recorded.</text><line x1="416" y1="526" x2="840" y2="526" stroke="#2e2e2e" stroke-width="1"/><text x="432" y="546" font-size="12" font-weight="400" fill="#a1a1a1" text-anchor="start" >Anything not listed here isn't possible for this event. An action that's</text><text x="432" y="561" font-size="12" font-weight="400" fill="#a1a1a1" text-anchor="start" >listed but refused will tell you why, and the attempt is recorded.</text></svg>