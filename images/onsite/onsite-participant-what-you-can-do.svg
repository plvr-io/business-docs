<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 815" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0" y="0" width="460" height="900" rx="0" fill="#0a0a0a"/><rect x="20" y="20" width="420" height="775" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/><text x="36" y="49" font-size="15" font-weight="600" fill="#fafafa" text-anchor="start" >What you can do</text><line x1="20" y1="66" x2="440" y2="66" stroke="#2e2e2e" stroke-width="1"/><text x="424" y="49" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="end" >Recommended first</text><rect x="36" y="82" width="388" height="118" rx="8" fill="#201d23" stroke="#c696ff" stroke-width="2"/><rect x="48" y="94" width="107.052" height="22" rx="6" fill="#2e1065" stroke="#5b21b6" stroke-width="1"/><text x="56" y="109.55" font-size="13" font-weight="500" fill="#ede9fe" text-anchor="start" >Recommended</text><text x="48" y="134" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Put a wristband on</text><text x="48" y="152" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Binds a band to this ticket.</text><g><rect x="48" y="158" width="364" height="32" rx="6" fill="#c696ff"/><text x="170.0128" y="179.04" font-size="14" font-weight="500" fill="#171717" text-anchor="start" >Put a wristband on</text></g><rect x="36" y="210" width="388" height="34" rx="6" fill="none" stroke="#2e2e2e" stroke-width="1"/><text x="48" y="232" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Hide everything else (3)</text><g transform="translate(396 219) scale(0.6666666666666666)" fill="none" stroke="#fafafa" color="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="36" y="266" font-size="12" font-weight="600" fill="#a1a1a1" text-anchor="start" letter-spacing="0.6">ENTRY</text><rect x="36" y="274" width="388" height="92" rx="6" fill="none" stroke="#2e2e2e" stroke-width="1"/><text x="48" y="298" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Admit with an override</text><text x="48" y="318" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Admits past a block that can be cleared at the desk.</text><text x="48" y="334" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >Does not fix the underlying record — the block stays on the</text><text x="48" y="350" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >ticket and stays visible.</text><text x="36" y="386" font-size="12" font-weight="600" fill="#a1a1a1" text-anchor="start" letter-spacing="0.6">WRISTBANDS</text><rect x="36" y="394" width="388" height="92" rx="6" fill="none" stroke="#2e2e2e" stroke-width="1"/><text x="48" y="418" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Put a wristband on and check in</text><text x="48" y="438" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Binds a band and admits them in one step.</text><text x="48" y="454" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >No balance moves — the balance belongs to the person, not</text><text x="48" y="470" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >the band.</text><g opacity="0.7"><rect x="36" y="494" width="388" height="110" rx="6" fill="none" stroke="#2e2e2e" stroke-width="1"/><text x="48" y="518" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Put a wristband on anyway</text><rect x="239.9616" y="502" width="95.13810000000001" height="22" rx="6" fill="#451a03" stroke="#92400e" stroke-width="1"/><g transform="translate(247.9616 507.0) scale(0.5)" fill="none" stroke="#fef3c7" color="#fef3c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="262.9616" y="517.55" font-size="13" font-weight="500" fill="#fef3c7" text-anchor="start" >Supervisor</text><text x="48" y="538" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Binds a band to a ticket the checks object to.</text><text x="48" y="554" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >Does not fix what was objected to — that stays on the ticket.</text><text x="48" y="570" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >No balance moves, and they are not entered until they tap.</text><text x="48" y="588" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Only a supervisor can do this. Ask one, or open a case.</text></g><rect x="30" y="490" width="400" height="118" rx="8" fill="none" stroke="#FF7A1A" stroke-width="2.5"/><circle cx="30" cy="490" r="12" fill="#FF7A1A"/><text x="30" y="495" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="36" y1="620" x2="424" y2="620" stroke="#2e2e2e" stroke-width="1"/><g><rect x="36" y="630" width="388" height="36" rx="6" fill="#151515" stroke="#2f2f2f" stroke-width="1"/><text x="158.4768" y="653.04" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Record a service case</text></g><text x="36" y="690" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Use this when nothing above resolves it, so the participant isn't</text><text x="36" y="706" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >turned away with nothing recorded.</text><rect x="30" y="624" width="400" height="44" rx="8" fill="none" stroke="#FF7A1A" stroke-width="2.5"/><circle cx="30" cy="624" r="12" fill="#FF7A1A"/><text x="30" y="629" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="20" y1="724" x2="440" y2="724" stroke="#2e2e2e" stroke-width="1"/><text x="36" y="744" font-size="12" font-weight="400" fill="#a1a1a1" text-anchor="start" >Anything not listed here isn't possible for this event. An action</text><text x="36" y="759" font-size="12" font-weight="400" fill="#a1a1a1" text-anchor="start" >that's listed but refused will tell you why, and the attempt is</text><text x="36" y="774" font-size="12" font-weight="400" fill="#a1a1a1" text-anchor="start" >recorded.</text></svg>