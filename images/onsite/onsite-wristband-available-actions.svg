<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 602" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0" y="0" width="520" height="602" rx="0" fill="#0a0a0a"/><rect x="20" y="20" width="480" height="562" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/><text x="36" y="49" font-size="15" font-weight="600" fill="#fafafa" text-anchor="start" >Available actions</text><line x1="20" y1="66" x2="500" y2="66" stroke="#2e2e2e" stroke-width="1"/><text x="484" y="49" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="end" >Each says what it leaves alone</text><rect x="36" y="82" width="448" height="150" rx="6" fill="none" stroke="#2e2e2e" stroke-width="1"/><text x="50" y="110" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Freeze the wristband</text><text x="50" y="132" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Stops this band being accepted at gates and tills.</text><text x="50" y="152" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >Blocks this band only. The balance stays spendable on any other band</text><text x="50" y="168" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >this person holds — freeze the wallet for that.</text><g><rect x="50" y="186" width="420" height="32" rx="6" fill="#151515" stroke="#2f2f2f" stroke-width="1"/><text x="197.26785" y="206.68" font-size="13" font-weight="500" fill="#fafafa" text-anchor="start" >Freeze the wristband</text></g><rect x="36" y="240" width="448" height="150" rx="6" fill="none" stroke="#2f2f2f" stroke-width="2" stroke-dasharray="5 4"/><text x="50" y="268" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Force rebind the wristband</text><rect x="378.61109999999996" y="254" width="91.3889" height="22" rx="6" fill="#451a03" stroke="#92400e" stroke-width="1"/><g transform="translate(386.61109999999996 259.0) scale(0.5)" fill="none" stroke="#fef3c7" color="#fef3c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="401.61109999999996" y="269.55" font-size="13" font-weight="500" fill="#fef3c7" text-anchor="start" >Restricted</text><text x="50" y="290" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Moves this band off the current holder’s ticket and onto another one.</text><text x="50" y="310" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >Detaches the current holder’s band. Their entry history and purchases</text><text x="50" y="326" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >are kept, and no balance moves.</text><g><rect x="50" y="344" width="420" height="32" rx="6" fill="#9d4042"/><text x="180.46339999999998" y="364.68" font-size="13" font-weight="500" fill="#fff" text-anchor="start" >Force rebind the wristband</text></g><rect x="36" y="398" width="448" height="128" rx="6" fill="none" stroke="#2e2e2e" stroke-width="1"/><text x="50" y="426" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Unfreeze the wristband</text><text x="50" y="448" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Lets this band be used again.</text><text x="50" y="468" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >Does not unfreeze the wallet. If spending is also stopped, that is a</text><text x="50" y="484" font-size="12.5" font-weight="500" fill="#fafafa" text-anchor="start" >separate action.</text><text x="50" y="514" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >This band is not frozen.</text><line x1="20" y1="544" x2="500" y2="544" stroke="#2e2e2e" stroke-width="1"/><text x="36" y="568" font-size="12" font-weight="400" fill="#a1a1a1" text-anchor="start" >Freezing a band and freezing a wallet are separate actions on separate objects.</text></svg>