<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 790" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0" y="0" width="520" height="790" rx="0" fill="#0a0a0a"/><rect x="0" y="0" width="520" height="790" rx="0" fill="#0a0a0a"/><line x1="0.5" y1="0" x2="0.5" y2="790" stroke="#222222" stroke-width="1"/><text x="20" y="30" font-size="16" font-weight="600" fill="#fafafa" text-anchor="start" >Admit with an override</text><rect x="20" y="52" width="480" height="66" rx="6" fill="none" stroke="#222222" stroke-width="1"/><text x="32" y="74" font-size="12" font-weight="500" fill="#a1a1a1" text-anchor="start" letter-spacing="0.6">YOU ARE ACTING ON</text><text x="32" y="94" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >TKT-20418</text><text x="32" y="111" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start" >Alex Chen</text><rect x="20" y="128" width="480" height="88" rx="8" fill="#221007" stroke="#78350f" stroke-width="1"/><text x="36" y="154" font-size="14" font-weight="600" fill="#fef3c7" text-anchor="start" >Overriding: Attendee details are missing</text><text x="36" y="176" font-size="13" font-weight="400" fill="#fef3c7" text-anchor="start" >This admits the person. It does not fix the ticket — the block stays on the</text><text x="36" y="194" font-size="13" font-weight="400" fill="#fef3c7" text-anchor="start" >record and stays visible to anyone who looks later.</text><text x="20" y="236" font-size="12" font-weight="500" fill="#a1a1a1" text-anchor="start" letter-spacing="0.6">WHAT WILL HAPPEN</text><circle cx="32" cy="255" r="2.5" fill="#fafafa"/><text x="44" y="260" font-size="13.5" font-weight="400" fill="#fafafa" text-anchor="start" >Admits past a block that can be cleared at the desk.</text><text x="20" y="292" font-size="12" font-weight="500" fill="#a1a1a1" text-anchor="start" letter-spacing="0.6">WHAT WILL NOT HAPPEN</text><circle cx="32" cy="311" r="2.5" fill="#a1a1a1"/><text x="44" y="316" font-size="13.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Does not fix the underlying record — the block stays on the ticket and</text><text x="44" y="334" font-size="13.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >stays visible.</text><text x="20" y="376" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Reason</text><text x="74" y="376" font-size="14" font-weight="500" fill="#ff6467" text-anchor="start" >*</text><rect x="20" y="384" width="480" height="36" rx="6" fill="#151515" stroke="#2f2f2f" stroke-width="1"/><text x="32" y="407.04" font-size="14" font-weight="400" fill="#a1a1a1" text-anchor="start" >Choose why you’re doing this</text><g opacity="0.55"><g transform="translate(474 394.0) scale(0.6666666666666666)" fill="none" stroke="#fafafa" color="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g></g><text x="20" y="438" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >A reason is required for this action. The note below is extra detail, not a</text><text x="20" y="454" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >substitute.</text><text x="20" y="482" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >What did you verify?</text><text x="164" y="482" font-size="14" font-weight="500" fill="#ff6467" text-anchor="start" >*</text><rect x="20" y="490" width="480" height="68" rx="6" fill="#151515" stroke="#2f2f2f" stroke-width="1"/><text x="32" y="512" font-size="13.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Who approved it, what you checked, and how you confirmed who they</text><text x="32" y="530" font-size="13.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >are.</text><text x="20" y="578" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Required, at least 12 characters. A reason code alone doesn’t say who</text><text x="20" y="594" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >approved this or what you checked — and this is the action someone will ask</text><text x="20" y="610" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >about later.</text><rect x="20" y="626" width="480" height="68" rx="6" fill="#3f1804" stroke="#92400e" stroke-width="1"/><rect x="32" y="640" width="16" height="16" rx="4" fill="#151515" stroke="#2f2f2f" stroke-width="1"/><text x="58" y="653" font-size="13.5" font-weight="400" fill="#fafafa" text-anchor="start" >I understand this admits a ticket the ordinary check-in refuses, and</text><text x="58" y="671" font-size="13.5" font-weight="400" fill="#fafafa" text-anchor="start" >that the block stays on the record.</text><line x1="0" y1="712" x2="520" y2="712" stroke="#222222" stroke-width="1"/><text x="20" y="736" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >Choose a reason.</text><g><rect x="20" y="746" width="232" height="36" rx="6" fill="#151515" stroke="#2f2f2f" stroke-width="1"/><text x="113.5048" y="769.04" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Cancel</text></g><g opacity="0.5"><rect x="268" y="746" width="232" height="36" rx="6" fill="#c696ff"/><text x="358.765" y="769.04" font-size="14" font-weight="500" fill="#171717" text-anchor="start" >Confirm</text></g><rect x="14" y="46" width="492" height="74" rx="8" fill="none" stroke="#FF7A1A" stroke-width="2.5"/><circle cx="14" cy="46" r="12" fill="#FF7A1A"/><text x="14" y="51" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="14" y="220" width="492" height="130" rx="8" fill="none" stroke="#FF7A1A" stroke-width="2.5"/><circle cx="14" cy="220" r="12" fill="#FF7A1A"/><text x="14" y="225" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="14" y="360" width="492" height="106" rx="8" fill="none" stroke="#FF7A1A" stroke-width="2.5"/><circle cx="14" cy="360" r="12" fill="#FF7A1A"/><text x="14" y="365" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="14" y="466" width="492" height="154" rx="8" fill="none" stroke="#FF7A1A" stroke-width="2.5"/><circle cx="14" cy="466" r="12" fill="#FF7A1A"/><text x="14" y="471" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="14" y="620" width="492" height="80" rx="8" fill="none" stroke="#FF7A1A" stroke-width="2.5"/><circle cx="14" cy="620" r="12" fill="#FF7A1A"/><text x="14" y="625" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text></svg>