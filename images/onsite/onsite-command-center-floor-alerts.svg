<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><clipPath id="pg"><rect width="616" height="330"/></clipPath></defs><g clip-path="url(#pg)"><rect x="0" y="0" width="616" height="330" rx="0" fill="#0a0a0a"/><rect x="28" y="28" width="560" height="76" rx="10" fill="#2a1204" stroke="#78350f" stroke-width="1"/><text x="44" y="56" font-size="14" font-weight="600" fill="#fef3c7" text-anchor="start">Operational health: Degraded</text><text x="44" y="78" font-size="14" font-weight="400" fill="#fef3c7" text-anchor="start">1 station or method is producing repeat failures.</text><rect x="28" y="120" width="560" height="180" rx="10" fill="#171717" stroke="#303030" stroke-width="1"/><text x="44" y="150" font-size="16" font-weight="600" fill="#fafafa" text-anchor="start">Floor alerts</text><text x="572" y="149" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="end">Clustered failures, not individual cases</text><line x1="28" y1="168" x2="588" y2="168" stroke="#303030" stroke-width="1"/><line x1="45" y1="184" x2="45" y2="282" stroke="#f59e0b" stroke-width="2"/><text x="58" y="200" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start">3 unresolved top-ups at Gate A Top-up (Card terminal)</text><text x="58" y="220" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">3 top-ups unresolved at Gate A Top-up using Card terminal. Several at</text><text x="58" y="237" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">once points at a fault there rather than 3 separate participant</text><text x="58" y="254" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">problems — stop using that method and handle these together.</text><text x="58" y="275" font-size="13" font-weight="500" fill="#fafafa" text-anchor="start">Stop using that method at that station and handle these together.</text></g></svg>