<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><clipPath id="pg"><rect width="556" height="800"/></clipPath></defs><g clip-path="url(#pg)"><rect x="0" y="0" width="556" height="800" rx="0" fill="#050505"/><rect x="28" y="20" width="500" height="760" rx="0" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/><text x="48" y="56" font-size="18" font-weight="600" fill="#fafafa" text-anchor="start">Record a service case</text><line x1="28" y1="704" x2="528" y2="704" stroke="#262626" stroke-width="1"/><rect x="48" y="724" width="224.0" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="160.0" y="747.0" font-size="14" font-weight="500" fill="#fafafa" text-anchor="middle">Cancel</text><rect x="284.0" y="724" width="224.0" height="36" rx="8" fill="#c696ff"/><text x="396.0" y="747.0" font-size="14" font-weight="500" fill="#171717" text-anchor="middle">Record case</text><text x="48" y="102" font-size="14" font-weight="400" fill="#a1a1a1" text-anchor="start">A case records what happened and how it was concluded.</text><text x="48" y="122" font-size="14" font-weight="400" fill="#a1a1a1" text-anchor="start">Nothing is assigned or timed — it just makes sure this</text><text x="48" y="142" font-size="14" font-weight="400" fill="#a1a1a1" text-anchor="start">problem ends with an answer.</text><text x="48" y="190" font-size="14" font-weight="500" fill="#fafafa">What kind of problem?<tspan fill="#ff6467"> *</tspan></text><rect x="48" y="202" width="460" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="60" y="225.0" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Topped up but balance didn't go up</text><g transform="translate(480 212.0) scale(0.6666666666666666)" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="48" y="256" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">If this needs escalating, it will go to Payment review.</text><text x="48" y="300" font-size="14" font-weight="500" fill="#fafafa">What did they show you?<tspan fill="#ff6467"> *</tspan></text><rect x="48" y="312" width="460" height="36" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="60" y="335.0" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">NN-4821</text><text x="48" y="366" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">Copy it exactly — don’t correct the spelling or capitalisation.</text><text x="48" y="383" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">What they actually presented is the record.</text><text x="48" y="427" font-size="14" font-weight="500" fill="#fafafa">What did they say?</text><rect x="48" y="439" width="460" height="70" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="60" y="462" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">“I paid twice and nothing showed up.”</text><text x="48" y="541" font-size="14" font-weight="500" fill="#fafafa">What happened at the desk?<tspan fill="#ff6467"> *</tspan></text><rect x="48" y="553" width="460" height="96" rx="8" fill="#181818" stroke="#2f2f2f" stroke-width="1"/><text x="60" y="576" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Checked the ledger for alex@example.com. The top-up</text><text x="60" y="596" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">shows as pending and the balance is unchanged.</text><text x="60" y="616" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start">Could not credit it from the desk.</text></g></svg>