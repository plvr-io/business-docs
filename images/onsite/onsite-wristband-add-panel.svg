<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0" y="0" width="560" height="560" rx="0" fill="#0a0a0a"/><rect x="0" y="0" width="560" height="560" rx="0" fill="#0a0a0a"/><line x1="0.5" y1="0" x2="0.5" y2="560" stroke="#222222" stroke-width="1"/><text x="20" y="30" font-size="16" font-weight="600" fill="#fafafa" text-anchor="start" >Add wristbands to this event</text><rect x="20" y="52" width="520" height="92" rx="8" fill="#0f1528" stroke="#1e3a8a" stroke-width="1"/><text x="36" y="80" font-size="14" font-weight="600" fill="#dbeafe" text-anchor="start" >These bands won’t belong to anyone yet</text><text x="36" y="102" font-size="13" font-weight="400" fill="#dbeafe" text-anchor="start" >This makes them available on this event so they can be bound when someone</text><text x="36" y="121" font-size="13" font-weight="400" fill="#dbeafe" text-anchor="start" >collects one. It creates no wallet and binds nothing.</text><text x="20" y="162" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Wristband UIDs or printed IDs</text><text x="212" y="162" font-size="14" font-weight="500" fill="#ff6467" text-anchor="start" >*</text><rect x="20" y="170" width="520" height="132" rx="6" fill="#151515" stroke="#2f2f2f" stroke-width="1"/><text x="32" y="196" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">WB-8842-19</text><text x="32" y="218" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">WB-8842-20</text><text x="32" y="240" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">WB-8842-21</text><text x="20" y="322" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >One per line — a tag UID from a reader, or the printed ID. Separators don’t matter:</text><text x="20" y="338" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >04:A2:B3 and 04a2b3 are the same band. 3 bands ready.</text><text x="20" y="368" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Note</text><rect x="20" y="376" width="520" height="36" rx="6" fill="#151515" stroke="#2f2f2f" stroke-width="1"/><text x="32" y="399.04" font-size="14" font-weight="400" fill="#a1a1a1" text-anchor="start" >Which box these came from, if it matters later.</text><g transform="translate(20 425) scale(0.5833333333333334)" fill="none" stroke="#a1a1a1" color="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></g><text x="42" y="436" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >A</text><text x="54.25125" y="436" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >band</text><text x="86.71625" y="436" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >nobody</text><text x="132.82875" y="436" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >has</text><text x="157.31125000000003" y="436" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >seen</text><text x="189.00375000000003" y="436" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >before</text><text x="229.32250000000002" y="436" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >is</text><text x="242.21750000000003" y="436" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >registered</text><text x="303.26500000000004" y="436" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >to</text><text x="317.70500000000004" y="436" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="start" >this</text><text x="341.415" y="436" font-size="12.5" font-weight=