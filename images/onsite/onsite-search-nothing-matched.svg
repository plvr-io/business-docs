<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0" y="0" width="760" height="300" rx="0" fill="#0a0a0a"/><rect x="20" y="16" width="720" height="56" rx="8" fill="#151515" stroke="#7b5e9d" stroke-width="2"/><g transform="translate(36 34) scale(0.8333333333333334)" fill="none" stroke="#c696ff" color="#c696ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g><text x="68" y="50" font-size="16" font-weight="400" fill="#fafafa" text-anchor="start" >ZZZ999</text><g><g transform="translate(665.9979 36.0) scale(0.6666666666666666)" fill="none" stroke="#fafafa" color="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></g><text x="687.9979" y="48.68" font-size="13" font-weight="500" fill="#fafafa" text-anchor="start" >Clear</text></g><rect x="20" y="92" width="720" height="190" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/><text x="36" y="121" font-size="15" font-weight="600" fill="#fafafa" text-anchor="start" >Nothing matched</text><text x="724" y="121" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="end" >Search never ends on a blank page</text><line x1="20" y1="138" x2="740" y2="138" stroke="#2e2e2e" stroke-width="1"/><line x1="20" y1="246" x2="740" y2="246" stroke="#2e2e2e" stroke-width="1"/><text x="36" y="269" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start" >Unmatched cases are logged with the query, the time and your name, so they can be reconciled later.</text><rect x="36" y="154" width="330" height="80" rx="6" fill="#201d23" stroke="#c696ff" stroke-width="2"/><text x="50" y="182" font-size="14" font-weight="500" fill="#fafafa" text-anchor="start" >Create unmatched case</text><text x="50" y="202" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start" >Record what they told you and escalate, so they</text><text x="50" y="219" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start" >aren't turned away with nothing.</text><rect x="31" y="149" width="340" height="90" rx="8" fill="none" stroke="#FF7A1A" stroke-width="2.5"/></svg>