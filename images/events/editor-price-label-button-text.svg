<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0" y="0" width="760" height="330" rx="0" fill="#0a0a0a"/><circle cx="690" cy="28" r="17" fill="#0a0a0a" stroke="#2f2f2f" stroke-width="1.5"/><circle cx="730" cy="28" r="17" fill="#0a0a0a" stroke="#2f2f2f" stroke-width="1.5"/><path d="M684,28 l4,4 l8,-8" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M725,23 L735,33 M735,23 L725,33" fill="none" stroke="#fafafa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="20" y="56" width="720" height="258" rx="14" fill="#171717"/><rect x="40" y="76" width="380" height="62" rx="12" fill="#0a0a0a" stroke="#2f2f2f" stroke-width="1"/><text x="58" y="116" font-size="20" font-weight="600" fill="#fafafa" text-anchor="start">From</text><rect x="114" y="92" width="130" height="30" rx="8" fill="#262626"/><text x="126" y="112" font-size="13" font-weight="600" fill="#fafafa" text-anchor="start">Lowest price</text><path d="M226.5,103.5 L233.5,110.5 M233.5,103.5 L226.5,110.5" fill="none" stroke="#a1a1a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M391,102 L401,112 M401,102 L391,112" fill="none" stroke="#a1a1a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="420" y="158" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="end">21/28</text><text x="40" y="184" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">Shown instead of the ticket price. Leave blank to keep</text><text x="40" y="204" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">the default. Use the button below to include the</text><text x="40" y="224" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">current lowest price.</text><rect x="40" y="254" width="184" height="38" rx="8" fill="#171717" stroke="#2f2f2f" stroke-width="1"/><text x="132" y="278" font-size="14" font-weight="400" fill="#a1a1a1" text-anchor="middle">Insert lowest price</text><rect x="460" y="76" width="262" height="62" rx="31" fill="#c696ff" stroke="#7c3aed" stroke-width="1.5"/><text x="560" y="113" font-size="17" font-weight="700" fill="#2a1050" text-anchor="middle">Join</text><path d="M695,102 L705,112 M705,102 L695,112" fill="none" stroke="#2a1050" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="722" y="158" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="end">4/8</text><text x="464" y="184" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">The purchase button's wording.</text><text x="464" y="204" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">Leave blank to keep the default</text><text x="464" y="224" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="start">“Buy now”.</text></svg>